:root {
  --bg: #0B0A08;
  --surface: #141210;
  --surface-2: #1C1915;
  --surface-3: #262119;
  --line: #2B2619;
  --line-strong: #4A3F22;
  --gold: #F2C230;
  --gold-bright: #FFD84D;
  --gold-dim: #B8933A;
  --gold-faint: #75612F;
  --gold-wash: rgba(242, 194, 48, 0.08);
  --gold-wash-2: rgba(242, 194, 48, 0.16);
  --ink-on-gold: #110E08;
  --good: #8BD17C;
  --danger: #E0603F;
  --display: 'Bebas Neue', 'Oswald', Impact, 'Arial Narrow', sans-serif;
  --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --radius: 6px;
  --tabbar-h: 64px;
  --sat: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--gold);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus, var(--gold-bright)); outline-offset: 2px; }
::selection { background: var(--gold); color: var(--ink-on-gold); }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 400; letter-spacing: 0.02em; text-wrap: balance; color: var(--gold-bright); }
h1 { font-size: 40px; line-height: 1; }
h2 { font-size: 28px; line-height: 1.05; }
h3 { font-size: 22px; line-height: 1.1; }
p { margin: 0; }
a { color: var(--gold-bright); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--gold-dim); }
.faint { color: var(--gold-faint); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-dim); font-weight: 600; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---- Shell ---- */
.app { max-width: 720px; margin: 0 auto;
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block: 0 calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom)); }
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: calc(12px + var(--sat)) 10px;
  background: linear-gradient(var(--bg) 82%, rgba(11, 10, 8, 0));
}
.wordmark { display: flex; align-items: baseline; gap: 10px; }
.wordmark h1 { font-size: 34px; letter-spacing: 0.06em; }
.wordmark .rule { width: 22px; height: 3px; background: var(--gold); transform: translateY(-6px); }
.wordmark .sub { font-family: var(--display); font-size: 22px; letter-spacing: 0.14em; color: var(--gold-dim); text-transform: uppercase; }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold-dim); font-weight: 600; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold-faint); box-shadow: 0 0 0 2px var(--surface-2); }
.sync.on .dot { background: var(--good); }
.sync.local .dot { background: var(--gold); }

.view { display: grid; gap: 18px; padding-top: 6px; }
.section { display: grid; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.divider { height: 1px; background: var(--line); }

/* ---- Cards ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.card.lift { border-color: var(--line-strong); background: var(--surface-2); }
.card.gold { background: var(--gold); color: var(--ink-on-gold); border-color: var(--gold); }
.card.gold h2, .card.gold h3, .card.gold .eyebrow, .card.gold .muted { color: var(--ink-on-gold); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 8px; }

/* ---- Pills ---- */
.pill { display: inline-block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--gold-dim); line-height: 1.3; }
.pill.solid { background: var(--gold); border-color: var(--gold); color: var(--ink-on-gold); }
.pill.good { border-color: var(--good); color: var(--good); }

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px;
  border: 1px solid var(--gold-dim); border-radius: var(--radius);
  background: transparent; color: var(--gold);
  font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
}
.btn:hover { border-color: var(--gold); background: var(--gold-wash); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--ink-on-gold); font-family: var(--display); font-size: 22px; letter-spacing: 0.08em; min-height: 52px; }
.btn.primary:hover { background: var(--gold-bright); border-color: var(--gold-bright); }
.btn.ghost { border-color: transparent; color: var(--gold-dim); padding: 0 10px; }
.btn.ghost:hover { color: var(--gold); border-color: transparent; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: rgba(224, 96, 63, 0.12); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.icon-btn { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--gold); font-size: 20px; line-height: 1; }
.icon-btn:hover { border-color: var(--gold); }

/* ---- Fields ---- */
label.field { display: grid; gap: 5px; }
label.field > span { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-dim); font-weight: 600; }
.input, select, textarea, input[type="text"], input[type="number"], input[type="search"] {
  width: 100%; min-height: 44px; padding: 8px 12px;
  background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius);
  color: var(--gold-bright);
}
textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
select { appearance: none; -webkit-appearance: none; padding-right: 38px;
  background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
select.big { font-family: var(--display); font-size: 24px; letter-spacing: 0.04em; min-height: 56px; border-color: var(--gold-dim); }
input:focus, select:focus, textarea:focus { border-color: var(--gold); outline: none; }
input::placeholder, textarea::placeholder { color: var(--gold-faint); }
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--gold); }

/* ---- Today ---- */
.today-head { display: grid; gap: 4px; }
.today-head .date { font-family: var(--display); font-size: 30px; letter-spacing: 0.04em; color: var(--gold-bright); line-height: 1; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: grid; gap: 2px; }
.stat .v { font-family: var(--display); font-size: 28px; line-height: 1; color: var(--gold-bright); }
.stat .k { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-dim); font-weight: 600; }
@media (max-width: 460px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.preview-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
.preview-list .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.preview-list .item .n { font-weight: 600; color: var(--gold); }
.preview-list .item .t { color: var(--gold-dim); font-size: 14px; }
.preview-list .item .last { grid-column: 1 / -1; font-size: 13px; color: var(--gold-faint); }
.resume { border-left: 4px solid var(--gold); }
.recent { display: grid; gap: 0; border-top: 1px solid var(--line); }
.recent .item { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; }
.recent .d { font-family: var(--display); font-size: 20px; letter-spacing: 0.03em; color: var(--gold-bright); line-height: 1; }
.recent .d small { display: block; font-family: var(--body); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-dim); margin-top: 3px; }
.recent .m { color: var(--gold-dim); font-size: 13px; }

/* ---- Workout ---- */
.wo-head { display: grid; gap: 10px; }
.wo-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.wo-title h2 { font-size: 34px; }
.wo-meta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.wo-meta .clock { font-family: var(--display); font-size: 28px; letter-spacing: 0.06em; color: var(--gold-bright); line-height: 1; }
.progress { height: 4px; background: var(--surface-3); border-radius: 2px; overflow: hidden; }
.progress > div { height: 100%; background: var(--gold); transition: width 0.3s ease; }
.ex-list { display: grid; gap: 12px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 12px; display: grid; gap: 10px; border-left: 4px solid var(--line-strong); }
.ex.done { border-left-color: var(--good); }
.ex.done .ex-name { color: var(--gold-dim); }
.ex.skipped { opacity: 0.55; }
.ex-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
.ex-name { font-family: var(--display); font-size: 24px; letter-spacing: 0.03em; color: var(--gold-bright); line-height: 1.05; }
.ex-target { font-size: 14px; color: var(--gold-dim); margin-top: 3px; }
.ex-last { font-size: 13px; color: var(--gold-faint); }
.ex-last b { color: var(--gold-dim); font-weight: 600; }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 32px 1fr 1fr 44px; gap: 6px; align-items: center; }
.set .idx { font-family: var(--display); font-size: 20px; color: var(--gold-dim); letter-spacing: 0.04em; text-align: center; }
.set.head { min-height: 0; margin-bottom: -2px; }
.set.head span { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-faint); font-weight: 600; text-align: center; }
.set .fld input { padding: 8px 6px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.set .fld.narrow input { color: var(--gold-dim); font-weight: 400; }
.set.done .fld input { border-color: var(--line); color: var(--gold-dim); background: var(--surface); }
.tick { width: 44px; height: 44px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface-2); color: transparent; display: inline-flex; align-items: center; justify-content: center; }
.tick::before { content: ''; width: 12px; height: 7px; border-left: 3px solid currentColor; border-bottom: 3px solid currentColor; transform: translateY(-2px) rotate(-45deg); }
.tick.on { background: var(--gold); border-color: var(--gold); color: var(--ink-on-gold); }
.ex-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ex-note { font-size: 14px; color: var(--gold-dim); font-style: italic; }
.rest-bar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); z-index: 30;
  display: flex; justify-content: center; padding: 0 16px 8px;
  pointer-events: none;
}
.rest-bar .inner { pointer-events: auto; width: 100%; max-width: 688px; display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; background: var(--gold); color: var(--ink-on-gold); border-radius: var(--radius); padding: 8px 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55); }
.rest-bar .lbl { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }
.rest-bar .t { font-family: var(--display); font-size: 34px; letter-spacing: 0.06em; line-height: 1; font-variant-numeric: tabular-nums; }
.rest-bar .btn { border-color: var(--ink-on-gold); color: var(--ink-on-gold); min-height: 38px; }
.rest-bar .btn:hover { background: rgba(0, 0, 0, 0.1); }

/* ---- Finish / summary ---- */
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rpe button { min-height: 40px; border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 4px; color: var(--gold-dim); font-family: var(--display); font-size: 18px; }
.rpe button.on { background: var(--gold); border-color: var(--gold); color: var(--ink-on-gold); }
.pb-list { display: grid; gap: 6px; }
.pb { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--gold-dim); border-radius: 4px; background: var(--gold-wash); }
.pb b { font-family: var(--display); font-size: 20px; letter-spacing: 0.03em; color: var(--gold-bright); font-weight: 400; }

/* ---- History ---- */
.hist { display: grid; gap: 8px; }
.hist .item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.hist .item > button.head { width: 100%; text-align: left; display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; background: transparent; border: 0; color: inherit; }
.hist .item .body { padding: 0 14px 14px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.hist .d { font-family: var(--display); font-size: 22px; letter-spacing: 0.03em; color: var(--gold-bright); line-height: 1; }
.hist .d small { display: block; font-family: var(--body); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-dim); margin-top: 3px; }
.hist .n { font-weight: 600; }
.hist .m { color: var(--gold-dim); font-size: 13px; }
.hist .v { font-family: var(--display); font-size: 20px; color: var(--gold); letter-spacing: 0.03em; text-align: right; }
.log-ex { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log-ex:last-child { border-bottom: 0; }
.log-ex .sets-str { color: var(--gold-dim); text-align: right; font-variant-numeric: tabular-nums; }

/* ---- Progress ---- */
.chart-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 8px 6px; position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.chart-wrap .tip { position: absolute; pointer-events: none; background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: 4px; padding: 6px 8px; font-size: 12px; color: var(--gold); white-space: nowrap; transform: translate(-50%, -110%); display: none; }
.chart-wrap .tip b { color: var(--gold-bright); }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-dim); font-weight: 600; padding: 6px 0; border-bottom: 1px solid var(--line-strong); }
.table td { padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.table td.r, .table th.r { text-align: right; }

/* ---- Library ---- */
.lib-group { display: grid; gap: 0; }
.lib-group .item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lib-group .item .n { font-weight: 600; }
.lib-group .item .m { font-size: 13px; color: var(--gold-dim); }
.ed-ex { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
.ed-ex .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ed-ex .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.ed-ex .tools { display: flex; gap: 4px; justify-content: flex-end; }
.help { font-size: 13px; color: var(--gold-dim); line-height: 1.5; }
.help code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--surface-3); padding: 1px 5px; border-radius: 3px; color: var(--gold); }
pre.example { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5; color: var(--gold-dim); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; overflow-x: auto; }

/* ---- Toast ---- */
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--gold-bright); color: var(--ink-on-gold); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 40; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---- Tab bar ---- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--line-strong);
  display: flex; justify-content: center;
}
.tabbar .inner { width: 100%; max-width: 720px; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: transparent; color: var(--gold-faint); font-family: var(--display); font-size: 18px; letter-spacing: 0.1em; display: grid; gap: 2px; place-items: center; padding-top: 6px; position: relative; }
.tab .bar { width: 26px; height: 3px; background: transparent; border-radius: 2px; }
.tab.on { color: var(--gold-bright); }
.tab.on .bar { background: var(--gold); }
.tab .badge { position: absolute; top: 8px; right: calc(50% - 30px); width: 8px; height: 8px; border-radius: 50%; background: var(--good); }

/* ---- Modal ---- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.7); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.modal .sheet { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 18px 16px; display: grid; gap: 14px; max-height: calc(100vh - 32px); overflow: auto; }
@media (min-width: 600px) { .modal { align-items: center; } }

.empty { text-align: center; color: var(--gold-dim); padding: 24px 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* a value copied down from the set above flashes once */
.set .fld input.carried { border-color: var(--gold); background: var(--gold-wash-2); transition: background 0.5s ease, border-color 0.5s ease; }

/* ---- Week strip ---- */
.weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 2px 7px; display: grid; gap: 4px; justify-items: center; min-height: 60px; align-content: start; }
.wd .l { font-family: var(--display); font-size: 16px; letter-spacing: 0.06em; color: var(--gold-dim); line-height: 1; }
.wd .t { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold-faint); font-weight: 600; text-align: center; line-height: 1.15; }
.wd.today { border-color: var(--gold); background: var(--gold-wash); }
.wd.today .l { color: var(--gold-bright); }
.wd.today .t { color: var(--gold); }
.wd.done { border-color: var(--good); }
.wd.done .t { color: var(--good); }
.wd:hover { border-color: var(--gold-dim); }

/* ---- Week plan editor ---- */
.plan-grid { display: grid; gap: 8px; }
.plan-row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; }
.plan-row .dn { font-family: var(--display); font-size: 18px; letter-spacing: 0.03em; color: var(--gold-bright); }
@media (max-width: 400px) { .plan-row { grid-template-columns: 78px 1fr; } }

/* keep the header on one line on narrow phones — the dot still carries the meaning */
@media (max-width: 460px) { .sync span:not(.dot) { display: none; } .sync { gap: 0; } }

/* ---- Swap ---- */
.ex-top-actions { display: flex; gap: 2px; align-items: flex-start; }
.swap-list { display: grid; gap: 8px; max-height: 52vh; overflow-y: auto; }
.swap { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; text-align: left;
  background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 12px 14px; color: inherit; }
.swap:hover { border-color: var(--gold); background: var(--surface-3); }
.swap .n { font-family: var(--display); font-size: 20px; letter-spacing: 0.02em; color: var(--gold-bright); line-height: 1.1; }
.swap .m { font-size: 12.5px; color: var(--gold-faint); margin-top: 3px; }
.swap .kit { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--gold-dim); border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="wordmark"><h1>AB29</h1><span class="sub">Training</span></div>
    <div class="sync local" id="sync" title="Where your history is saved"><span class="dot"></span><span id="syncLabel">Saving on this device</span></div>
  </header>

  <main>
    <section class="view" id="view-today"></section>
    <section class="view" id="view-history" hidden></section>
    <section class="view" id="view-progress" hidden></section>
    <section class="view" id="view-library" hidden></section>
  </main>
</div>

<div class="rest-bar" id="restBar" hidden>
  <div class="inner">
    <span class="lbl">Rest</span>
    <span class="t num" id="restTime">1:30</span>
    <button class="btn sm" id="restPlus" type="button">+30s</button>
    <button class="btn sm" id="restSkip" type="button">Skip</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<nav class="tabbar" aria-label="Sections">
  <div class="inner">
    <button class="tab on" data-tab="today" id="tab-today" type="button"><span>Today</span><span class="bar"></span></button>
    <button class="tab" data-tab="history" id="tab-history" type="button"><span>History</span><span class="bar"></span></button>
    <button class="tab" data-tab="progress" id="tab-progress" type="button"><span>Progress</span><span class="bar"></span></button>
    <button class="tab" data-tab="library" id="tab-library" type="button"><span>Library</span><span class="bar"></span></button>
  </div>
</nav>

/* Returns { muscle, options:[{name, kit, last}] } or null when we have nothing sensible. */
function swapsFor(ex) {
  if (!ex || (ex.kind !== 'weight' && ex.kind !== 'reps')) return null;
  const key = slug(ex.name);
  const entry = SWAPS[key] || SWAPS[slug(String(ex.name).replace(/\s*\(.*?\)\s*/g, ' ').trim())];
  const muscle = entry && entry.muscle;
  let list = (entry && entry.alts) || (muscle && MUSCLE_ALTS[muscle]) || null;
  if (!list) return null;
  const here = normName(ex.name);
  const seen = new Set([here]);
  const options = [];
  for (const [name, kit] of list) {
    if (seen.has(normName(name))) continue;
    seen.add(normName(name));
    options.push({ name, kit, last: lastEntry(name, S.active && S.active.id) });
  }
  /* top up from the muscle group if a bespoke list is short */
  if (muscle && MUSCLE_ALTS[muscle]) {
    for (const [name, kit] of MUSCLE_ALTS[muscle]) {
      if (options.length >= 6) break;
      if (seen.has(normName(name))) continue;
      seen.add(normName(name));
      options.push({ name, kit, last: lastEntry(name, S.active && S.active.id) });
    }
  }
  return options.length ? { muscle: muscle || 'Same muscles', options } : null;
}
/* ================= Email a session summary =================
   Inside the Claude link: sends through the viewer's Gmail connector (mcp capability).
   On the GitHub copy (or anywhere fetch is allowed): posts to Web3Forms with the access key in Settings. */
function sessionSubject(log) {
  const bits = [fmtDur(log.duration), logHeadline(log)].filter(Boolean).join(', ');
  return `AB29 Training: ${log.name} — ${fmtDate(log.finishedAt, { weekday: 'short', day: 'numeric', month: 'short' })} (${bits})`;
}
function sessionSummaryText(log, pbs) {
  const lines = [];
  lines.push(`AB29 TRAINING — ${String(log.name || '').toUpperCase()}`);
  lines.push(`${log.program || ''}`.trim());
  lines.push(`${fmtDate(log.finishedAt, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} · ${fmtTimeOfDay(log.startedAt)}–${fmtTimeOfDay(log.finishedAt)} · ${fmtDur(log.duration)}${log.rpe ? ` · RPE ${log.rpe}` : ''}`);
  const vol = volumeOf(log), dist = distanceOf(log);
  const totals = [];
  if (vol > 0) totals.push(`${fmtNum(vol, 0)} ${S.prefs.units} lifted`);
  if (dist > 0) totals.push(`${fmtNum(dist, 2)} km covered`);
  const setsDone = (log.exercises || []).reduce((n, e) => n + (e.sets || []).length, 0);
  totals.push(`${setsDone} set${setsDone === 1 ? '' : 's'}`);
  lines.push(totals.join(' · '));
  lines.push('');
  (log.exercises || []).filter(e => (e.sets || []).length).forEach((e, i) => {
    const sets = e.sets.map(s => fmtSet(e.kind, s, true)).join(', ');
    lines.push(`${i + 1}. ${e.name}${e.target ? ` (${e.target})` : ''}`);
    lines.push(`   ${sets}${e.note ? ` — ${e.note}` : ''}`);
  });
  if (pbs && pbs.length) {
    lines.push('');
    lines.push(pbs.length === 1 ? 'PERSONAL BEST' : 'PERSONAL BESTS');
    pbs.forEach(p => lines.push(`• ${p.name} — ${p.label} ${p.value} (was ${p.prev})`));
  }
  if (log.notes) { lines.push(''); lines.push(`Notes: ${log.notes}`); }
  lines.push('');
  lines.push('Sent by AB29 Training');
  return lines.join('\n');
}
function gmailErrorText(e) {
  const code = e && e.code;
  if (code === 'needs_reauth') return 'Email not sent — reconnect Gmail in claude.ai Settings → Connectors';
  if (code === 'server_not_connected' || code === 'server_not_found') return 'Email not sent — add Gmail in claude.ai Settings → Connectors';
  if (code === 'selection_required') return 'Email not sent — choose which Gmail account this page may use';
  if (code === 'not_in_manifest' || code === 'consent_required') return 'Email not sent — Gmail access was declined for this page';
  if (code === 'blocked_by_policy' || code === 'approval_required') return 'Email not sent — Gmail is blocked for this page by policy';
  if (code === 'tool_error') return 'Gmail reported an error — session saved, email not sent';
  if (code === 'server_unavailable' || code === 'upstream_error') return 'Gmail didn’t answer — the session is saved, try again from History';
  if (code === 'cancelled') return 'Email cancelled';
  return 'Email not sent — the session is saved';
}
async function emailSession(log, pbs, opts) {
  opts = opts || {};
  if (S.prefs.emailOn === false && !opts.force) return;
  const to = String(S.prefs.emailTo || '').trim();
  if (!to || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) { toast('Add a valid email address in Library → Settings first'); return; }
  const subject = opts.subject || sessionSubject(log);
  const body = opts.body || sessionSummaryText(log, pbs);
  if (Store.mcp) {
    try {
      await Store.mcp.callTool('Gmail', 'send_message', { to: [to], subject, body });
      toast(`Emailed to ${to}`);
    } catch (e) { console.warn('gmail send failed', e); toast(gmailErrorText(e)); }
    return;
  }
  const key = String(S.prefs.emailKey || '').trim();
  if (!key) { toast('Add your Web3Forms key in Library → Settings to email sessions'); return; }
  try {
    const r = await fetch('https://api.web3forms.com/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ access_key: key, subject, from_name: 'AB29 Training', message: body }),
    });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (r.ok && j && j.success) toast(`Emailed to ${to}`);
    else toast('Email failed: ' + ((j && j.message) || ('HTTP ' + r.status)));
  } catch (e) {
    console.warn('web3forms send failed', e);
    toast('Email couldn’t be sent from this page — the session is saved');
  }
}

  const typeSel = el('select', { id: 'edType' }, Object.entries(TYPES).map(([k, l]) => el('option', { value: k, selected: draft.type === k }, l))); typeSel.addEventListener('change', () => draft.type = typeSel.value);
  const focusIn = el('input', { type: 'text', id: 'edFocus', value: draft.focus || '', placeholder: 'One line on what the session is for' }); focusIn.addEventListener('input', () => draft.focus = focusIn.value);

  const exWrap = el('div', { class: 'stack' });
  const drawEx = () => {
    exWrap.innerHTML = '';
    draft.exercises.forEach((e, i) => {
      const n = el('input', { type: 'text', id: `edEx${i}Name`, value: e.name, placeholder: 'Exercise' }); n.addEventListener('input', () => e.name = n.value);
      const k = el('select', { id: `edEx${i}Kind` }, Object.entries(KINDS).map(([kk, d]) => el('option', { value: kk, selected: e.kind === kk }, d.label))); k.addEventListener('change', () => { e.kind = k.value; drawEx(); });
      const sets = el('input', { type: 'text', inputmode: 'numeric', id: `edEx${i}Sets`, value: e.sets, placeholder: 'sets' }); sets.addEventListener('input', () => e.sets = sets.value);
      const tgt = el('input', { type: 'text', id: `edEx${i}Target`, value: e.target || '', placeholder: e.kind === 'weight' ? 'reps, e.g. 6–8' : e.kind === 'time' ? 'e.g. 45s' : e.kind === 'cardio' ? 'e.g. 5 km easy' : 'target' }); tgt.addEventListener('input', () => e.target = tgt.value);
      const rest = el('input', { type: 'text', inputmode: 'numeric', id: `edEx${i}Rest`, value: e.rest == null ? 90 : e.rest, placeholder: 'rest s' }); rest.addEventListener('input', () => e.rest = rest.value);
      const note = el('input', { type: 'text', id: `edEx${i}Note`, value: e.note || '', placeholder: 'Cue or note (optional)' }); note.addEventListener('input', () => e.note = note.value);
      const extras = [];
      if (e.kind === 'cardio') { const d = el('input', { type: 'text', inputmode: 'decimal', id: `edEx${i}Dist`, value: e.dist == null ? '' : e.dist, placeholder: 'km per set' }); d.addEventListener('input', () => e.dist = d.value); extras.push(field('Distance (km)', d)); }
      if (e.kind === 'carry') { const d = el('input', { type: 'text', inputmode: 'decimal', id: `edEx${i}Metres`, value: e.metres == null ? '' : e.metres, placeholder: 'metres per set' }); d.addEventListener('input', () => e.metres = d.value); extras.push(field('Distance (m)', d)); }
      if (e.kind === 'time') { const c = el('input', { type: 'checkbox', id: `edEx${i}Lower`, checked: !!e.lowerIsBetter }); c.addEventListener('change', () => e.lowerIsBetter = c.checked); extras.push(el('label', { class: 'check' }, c, el('span', null, 'Faster is better (for-time effort)'))); }
      exWrap.appendChild(el('div', { class: 'ed-ex' },
        el('div', { class: 'row between' }, el('span', { class: 'eyebrow' }, `Exercise ${i + 1}`), el('div', { class: 'tools' },
          el('button', { class: 'btn ghost sm', type: 'button', disabled: i === 0, 'aria-label': 'Move up', onclick: () => { [draft.exercises[i - 1], draft.exercises[i]] = [draft.exercises[i], draft.exercises[i - 1]]; drawEx(); } }, '↑'),
          el('button', { class: 'btn ghost sm', type: 'button', disabled: i === draft.exercises.length - 1, 'aria-label': 'Move down', onclick: () => { [draft.exercises[i + 1], draft.exercises[i]] = [draft.exercises[i], draft.exercises[i + 1]]; drawEx(); } }, '↓'),
          el('button', { class: 'btn ghost sm', type: 'button', 'aria-label': 'Remove exercise', onclick: () => { draft.exercises.splice(i, 1); drawEx(); } }, '✕'),
        )),
        field('Name', n),
        el('div', { class: 'grid' }, field('Log as', k), field('Sets', sets)),
        el('div', { class: 'grid' }, field(e.kind === 'weight' || e.kind === 'reps' ? 'Target reps' : 'Target', tgt), field('Rest (seconds)', rest)),
        extras,
        field('Note', note),
      ));
    });
  };
  drawEx();
  const actions = el('div', { class: 'row between' });
  actions.appendChild(el('button', { class: 'btn', type: 'button', onclick: () => { S.ui.editing = null; render(); } }, 'Cancel'));
  const right = el('div', { class: 'row' });
  if (!isNew) {
    const del = el('button', { class: 'btn ghost sm', type: 'button' }, builtin ? 'Hide session' : 'Delete session');
    let armed = false;
    del.addEventListener('click', () => { if (!armed) { armed = true; del.textContent = 'Tap again to confirm'; del.classList.add('danger'); setTimeout(() => { armed = false; del.textContent = builtin ? 'Hide session' : 'Delete session'; del.classList.remove('danger'); }, 3000); return; }
      Store.putSession({ id: draft.id, deleted: true, updatedAt: Date.now() }); S.ui.editing = null; toast(builtin ? 'Hidden — restore it from the Library any time' : 'Session deleted'); render(); });
    right.appendChild(del);
    if (builtin && S.sessions[draft.id]) right.appendChild(el('button', { class: 'btn ghost sm', type: 'button', onclick: () => { Store.putSession({ id: draft.id, deleted: false, updatedAt: Date.now() }); S.ui.editing = null; toast('Back to the default version'); render(); } }, 'Reset to default'));
  }
  right.appendChild(el('button', { class: 'btn primary', type: 'button', onclick: () => {
    if (!draft.name.trim()) { toast('Give the session a name'); nameIn.focus(); return; }
    const s = normaliseSession(clone(draft));
    if (!s.exercises.length && s.id !== 'free') { toast('Add at least one exercise'); return; }
    delete s.builtin;
    Store.putSession(s); S.ui.editing = null; S.prefs.lastPick = s.id; Store.putPrefs(); toast('Saved'); render();
  } }, 'Save'));
  actions.appendChild(right);

  v.appendChild(el('div', { class: 'section-head' }, el('h2', null, isNew ? 'New session' : `Edit · ${draft.name}`), builtin ? el('span', { class: 'pill' }, 'Built-in') : null));
  v.appendChild(el('div', { class: 'card stack' }, field('Session name', nameIn), field('Program / group', progIn), dl, el('div', { class: 'ed-ex-grid', style: 'display:grid;grid-template-columns:1fr 1fr;gap:8px' }, field('Type', typeSel)), field('Focus (optional)', focusIn)));
  v.appendChild(el('div', { class: 'section-head' }, el('h3', null, 'Exercises'), el('button', { class: 'btn sm', type: 'button', onclick: () => { draft.exercises.push({ id: 'e' + uid(), name: '', kind: 'weight', sets: 3, target: '', rest: 90, note: '' }); drawEx(); setTimeout(() => { const last = $$('.ed-ex input[type="text"]', exWrap); const inp = $(`#edEx${draft.exercises.length - 1}Name`); inp && inp.focus(); }, 20); } }, '+ Exercise')));
  v.appendChild(exWrap);
  v.appendChild(actions);
}

/* ----- settings ----- */
function settings() {
  const units = el('select', { id: 'prefUnits' }, el('option', { value: 'kg', selected: S.prefs.units === 'kg' }, 'Kilograms (kg)'), el('option', { value: 'lb', selected: S.prefs.units === 'lb' }, 'Pounds (lb)'));
  units.addEventListener('change', () => { S.prefs.units = units.value; Store.putPrefs(); toast(`Showing weights in ${units.value}`); });
  const beep = el('input', { type: 'checkbox', id: 'prefBeep', checked: !!S.prefs.beep }); beep.addEventListener('change', () => { S.prefs.beep = beep.checked; Store.putPrefs(); });
  const setRpe = el('input', { type: 'checkbox', id: 'prefSetRpe', checked: S.prefs.setRpe !== false }); setRpe.addEventListener('change', () => { S.prefs.setRpe = setRpe.checked; Store.putPrefs(); });
  const emailOn = el('input', { type: 'checkbox', id: 'prefEmailOn', checked: S.prefs.emailOn !== false }); emailOn.addEventListener('change', () => { S.prefs.emailOn = emailOn.checked; Store.putPrefs(); });
  const emailTo = el('input', { type: 'text', inputmode: 'email', autocomplete: 'email', id: 'prefEmailTo', value: S.prefs.emailTo || '', placeholder: 'you@example.com' }); emailTo.addEventListener('change', () => { S.prefs.emailTo = emailTo.value.trim(); Store.putPrefs(); });
  const emailKey = el('input', { type: 'text', id: 'prefEmailKey', value: S.prefs.emailKey || '', placeholder: 'Web3Forms access key', autocomplete: 'off', spellcheck: 'false' }); emailKey.addEventListener('change', () => { S.prefs.emailKey = emailKey.value.trim(); Store.putPrefs(); });
  const importBox = el('textarea', { id: 'importBox', placeholder: 'Paste an AB29 Training backup (JSON) here', style: 'min-height:80px' });
  const fileIn = el('input', { type: 'file', id: 'importFile', accept: 'application/json,.json', style: 'display:none' });
  fileIn.addEventListener('change', () => { const f = fileIn.files[0]; if (!f) return; f.text().then(t => importJSON(t)); });
  return el('div', { class: 'card stack', id: 'settings' },
    el('h3', null, 'Settings & backup'),
    el('p', { class: 'small muted' }, Store.db ? 'Your history is saved to this link. Open it on your phone or laptop and it is all there.' : 'Your history is saved in this browser only. Export a backup now and then, or import one to move devices.'),
    el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:8px' }, el('label', { class: 'field' }, el('span', null, 'Units'), units), el('label', { class: 'check', style: 'align-self:end' }, beep, el('span', null, 'Beep when rest ends'))),
    el('label', { class: 'check' }, setRpe, el('span', null, 'Log RPE on every set (how hard it felt, 1–10)')),
    el('div', { class: 'row' },
      el('button', { class: 'btn sm', type: 'button', onclick: exportJSON }, 'Export backup'),
      el('button', { class: 'btn sm', type: 'button', onclick: copyBackup }, 'Copy backup'),
      el('button', { class: 'btn sm', type: 'button', onclick: () => fileIn.click() }, 'Import file'),
      fileIn,
    ),
    importBox,
    el('button', { class: 'btn sm', type: 'button', onclick: () => importJSON(importBox.value) }, 'Import pasted backup'),
    el('div', { class: 'divider' }),
    el('h3', null, 'Email each session'),
    el('p', { class: 'small muted' }, Store.mcp ? 'On this link, summaries are sent through your Gmail connector — claude.ai will ask you to allow it the first time.' : (Store.db ? 'Gmail sending isn’t available in this view, so the Web3Forms key below is used instead.' : 'On this copy, summaries are sent with your Web3Forms access key to the address that key was created for.')),
    el('label', { class: 'check' }, emailOn, el('span', null, 'Email me a summary when I save a session')),
    el('label', { class: 'field' }, el('span', null, 'Send to'), emailTo),
    el('label', { class: 'field' }, el('span', null, 'Web3Forms access key'), emailKey),
    el('div', { class: 'row' }, el('button', { class: 'btn sm', type: 'button', onclick: sendTestEmail }, 'Send test email')),
  );
}
function backupPayload() { return JSON.stringify({ app: 'graft', version: 1, exportedAt: new Date().toISOString(), sessions: S.sessions, logs: S.logs, prefs: S.prefs }); }
async function exportJSON() {
  const data = backupPayload(); const filename = `ab29-training-backup-${todayISO()}.json`;
  let dl = null;
  try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) { try { await dl.save({ filename, data }); toast('Backup saved'); } catch (e) { if (e && e.code === 'declined') return; toast('Could not save here — use Copy backup instead'); } return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Backup downloaded'); }
  catch (e) { copyBackup(); }
}
async function copyBackup() { try { await navigator.clipboard.writeText(backupPayload()); toast('Backup copied — paste it somewhere safe'); } catch (e) { toast('Copy failed — try Export instead'); } }
function importJSON(text) {
  let d; try { d = JSON.parse(text); } catch (e) { toast('That is not a valid backup'); return; }
  if (!d || d.app !== 'graft') { toast('That is not an AB29 Training backup'); return; }
  let n = 0;
  for (const s of Object.values(d.sessions || {})) { const cur = S.sessions[s.id]; if (!cur || (s.updatedAt || 0) > (cur.updatedAt || 0)) { Store.putSession(s); n++; } }
  for (const l of Object.values(d.logs || {})) { if (!S.logs[l.id]) { Store.putLog(l); n++; } }
  if (d.prefs && (d.prefs.updatedAt || 0) > (S.prefs.updatedAt || 0)) { S.prefs = Object.assign({}, S.prefs, d.prefs); Store.putPrefs(); }
  toast(n ? `Imported ${n} item${n === 1 ? '' : 's'}` : 'Nothing new in that backup'); render();
}

/* ================= Boot ================= */
function bindGlobal() {
  $$('.tab').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; if (S.tab !== 'library') S.ui.editing = null; render(); window.scrollTo({ top: 0 }); }));
  $('#restPlus').addEventListener('click', () => Rest.add(30));
  $('#restSkip').addEventListener('click', () => Rest.stop());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalRoot').children.length) closeModal(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Rest.end) Rest.tick(); });
}
function clockTick() { const c = $('#woClock'); if (c && S.active) c.textContent = fmtClock((Date.now() - new Date(S.active.startedAt)) / 1000); }
function start() {
  Store.loadLocal();
  bindGlobal();
  render();
  setInterval(clockTick, 1000);
  Store.connect().then(ok => { updateSync(); if (ok && !(S.tab === 'today' && S.active && document.activeElement && document.activeElement.tagName === 'INPUT')) render(); });
  Store.connectMcp();
}
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(start); else start();
</script>
</body>
