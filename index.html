let state={version:1,programmes:[...addedSessions,...defaults],history:[],active:null},view='train',selected='personal-push',editing=null,restUntil=0,restTick=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validProgramme(p){return p&&typeof p.id==='string'&&typeof p.name==='string'&&p.name.length>0&&p.name.length<=120&&typeof p.type==='string'&&Number.isFinite(p.minutes)&&p.minutes>0&&Array.isArray(p.exercises)&&p.exercises.length>0&&p.exercises.length<=100&&p.exercises.every(e=>typeof e.name==='string'&&e.name.length>0&&typeof e.target==='string'&&Number.isInteger(e.sets)&&e.sets>=1&&e.sets<=30&&['strength','timed','cardio'].includes(e.kind));}
function validWorkout(a){return a&&typeof a.id==='string'&&validProgramme(a.programme)&&Number.isFinite(a.started)&&Number.isInteger(a.index)&&a.index>=0&&a.index<a.programme.exercises.length&&typeof a.notes==='string'&&Array.isArray(a.logs)&&a.logs.length===a.programme.exercises.length&&a.logs.every((r,i)=>Array.isArray(r)&&r.length===a.programme.exercises[i].sets&&r.every(s=>typeof s.done==='boolean'&&['string','number'].includes(typeof s.weight)&&['string','number'].includes(typeof s.reps)&&['string','number'].includes(typeof s.minutes)&&['string','number'].includes(typeof s.distance)));}
function validData(d){return d&&d.version===1&&Array.isArray(d.programmes)&&d.programmes.length>0&&d.programmes.every(validProgramme)&&new Set(d.programmes.map(p=>p.id)).size===d.programmes.length&&Array.isArray(d.history)&&d.history.every(h=>validWorkout(h)&&Number.isFinite(h.finished))&&(!d.active||validWorkout(d.active));}
function warn(t){$('#storage-warning').hidden=false;$('#storage-warning').textContent=t;}
let storageBlocked=false;
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(!validData(d))throw Error('Invalid saved data');state=d;}}catch(e){storageBlocked=true;warn('Saved data could not be read. Existing storage has not been changed. Use Export backup to save this session, or restore a valid backup in History.');}
function save(){if(storageBlocked)return false;try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){warn('This browser could not save your changes. Keep this page open and export a backup from History.');return false;}}
function mergeSessionLibrary(){const ids=new Set(state.programmes.map(p=>p.id));state.programmes=[...addedSessions.filter(p=>!ids.has(p.id)).map(p=>JSON.parse(JSON.stringify(p))),...state.programmes];}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3200);}
function ask(title,text,action){$('#confirm-title').textContent=title;$('#confirm-text').textContent=text;$('#confirm').showModal();$('#accept-confirm').onclick=()=>{$('#confirm').close();action();};}
$('#cancel-confirm').onclick=()=>$('#confirm').close();
const clone=o=>JSON.parse(JSON.stringify(o)),date=n=>new Date(n).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
function switchView(v){view=v;editing=null;render();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
function sidebar(){const week=state.history.filter(h=>Date.now()-h.finished<7*86400000),last=state.history.at(-1);return `<aside class="sidebar"><section class="panel"><div class="eyebrow">Last 7 days</div><div class="stats"><div><div class="stat">${week.length}</div><div class="hint">sessions</div></div><div><div class="stat">${week.reduce((s,h)=>s+Math.round((h.finished-h.started)/60000),0)}</div><div class="hint">minutes elapsed</div></div></div><p class="hint">${week.length?'Every session adds to your story.':'Your next session starts here.'}</p></section><section class="panel"><div class="eyebrow">Last session</div>${last?`<h2>${esc(last.programme.name)}</h2><p class="hint">${date(last.finished)} · ${last.logs.flat().filter(s=>s.done).length} sets / steps logged</p><button class="small" onclick="switchView('history')">View history ↗</button>`:'<h2>A fresh start.</h2><p class="hint">Your completed sessions will appear here, ready to build on next time.</p>'}</section><section class="panel"><div class="eyebrow">Your training, saved</div><p class="hint">Sessions and progress stay in this browser, including a workout in progress. Export a backup before switching devices or clearing browser data.</p></section></aside>`;}
function intro(label,title){return `<div class="intro"><div><div class="eyebrow">${label}</div><h1>${title}</h1></div><div class="muted">${date(Date.now())}</div></div>`;}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#app').innerHTML=view==='train'?training():view==='history'?historyView():programmesView();bind();}
function training(){return intro('Show up. Build on it.','Make today count.')+`<div class="layout"><div>${state.active?activeView():pickView()}</div>${sidebar()}</div>`;}
function pickView(){const p=state.programmes.find(p=>p.id===selected)||state.programmes[0];selected=p.id;return `<section class="panel accent"><div class="row"><h2>Choose your session</h2><span class="badge">Ready when you are</span></div><label class="field">Today's session<select id="session-select">${[...new Set(state.programmes.map(q=>q.type))].map(type=>`<optgroup label="${esc(type)}">${state.programmes.filter(q=>q.type===type).map(q=>`<option value="${esc(q.id)}" ${q.id===selected?'selected':''}>${esc(q.name)}</option>`).join('')}</optgroup>`).join('')}</select></label><div class="row wrap"><span class="muted">${esc(p.type)} · About ${p.minutes} min · ${p.exercises.length} exercises / steps</span><button class="small" id="edit-selected">Edit session</button></div><div class="session-list">${p.exercises.map((e,i)=>`<div class="exercise"><div class="number">${String(i+1).padStart(2,'0')}</div><div><h3>${esc(e.name)}</h3><div class="muted">${esc(e.target)}</div>${referenceView(e)}</div></div>`).join('')}</div><p class="hint">${esc(p.note||'Editable template. Adjust the session to suit you and warm up before starting.')}</p><button class="primary" id="start">Start session →</button></section>`;}
function start(id){if(state.active)throw Error('A session is already active.');const p=state.programmes.find(p=>p.id===id);if(!p)throw Error('Session not found.');state.active={id:crypto.randomUUID(),programme:clone(p),started:Date.now(),index:0,notes:'',logs:p.exercises.map(e=>Array.from({length:e.sets},()=>({weight:'',reps:'',minutes:'',distance:'',done:false})))};save();view='train';render();}
function restLabel(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
function referenceView(e){if(!Array.isArray(e.reference))return '';return `<details class="reference"><summary>Screenshot reference · ${e.reference.length} sets</summary><div class="ref-scroll"><table><thead><tr><th>Set</th><th>kg</th><th>Reps</th><th>RPE</th><th>Rest</th></tr></thead><tbody>${e.reference.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.weight??'—')}</td><td>${esc(r.reps??'—')}</td><td>${esc(r.rpe??'—')}</td><td>${restLabel(r.rest)}</td></tr>`).join('')}</tbody></table></div>${e.referenceNote?`<p class="hint">${esc(e.referenceNote)}</p>`:''}<p class="hint">Copied from your screenshots. Blank values stay blank. These are not logged as a completed workout.</p></details>`;}
function extraFields(e,s,i){return `<div class="extra-fields">${e.kind!=='strength'?`<label class="field">Load (kg, optional)<input type="number" min="0" max="100000" step="any" inputmode="decimal" data-set="${i}" data-key="weight" value="${esc(s.weight)}"></label><label class="field">Reps (optional)<input type="number" min="0" max="100000" step="1" inputmode="numeric" data-set="${i}" data-key="reps" value="${esc(s.reps)}"></label>`:''}<label class="field">RPE (1–10, optional)<input type="number" min="1" max="10" step="0.5" inputmode="decimal" data-set="${i}" data-key="rpe" value="${esc(s.rpe??'')}"></label>${e.reference?.[i]?`<button class="small" data-rest="${Number(e.reference[i].rest)}">Rest ${restLabel(e.reference[i].rest)}</button>`:''}</div>`;}
function activeView(){const a=state.active,e=a.programme.exercises[a.index],done=a.logs.flat().filter(s=>s.done).length,total=a.logs.flat().length,previous=state.history.slice().reverse().find(h=>h.programme.exercises.some(q=>q.name.toLowerCase()===e.name.toLowerCase())),pi=previous?.programme.exercises.findIndex(q=>q.name.toLowerCase()===e.name.toLowerCase());const prev=previous?.logs[pi]?.filter(s=>s.done);return `<section class="panel accent"><div class="row wrap"><div><div class="eyebrow">Session in progress</div><h2>${esc(a.programme.name)}</h2></div><span class="badge">${done} / ${total} logged</span></div><progress value="${done}" max="${total}" aria-label="Session progress"></progress><div class="row"><div><div class="eyebrow">Exercise / step ${a.index+1} of ${a.programme.exercises.length}</div><h2 style="margin-top:16px">${esc(e.name)}</h2><p class="muted">${esc(e.target)}</p></div><div class="large-num">${String(a.index+1).padStart(2,'0')}</div></div>${referenceView(e)}<p class="hint">${prev?.length?`Last time · ${date(previous.finished)} · ${prev.map(s=>e.kind==='strength'?`${esc(s.weight||'—')} kg × ${esc(s.reps||'—')}`:`${esc(s.minutes||'—')} min${s.distance?' · '+esc(s.distance)+' km':''}${s.weight!==''?' · '+esc(s.weight)+' kg':''}${s.reps!==''?' · '+esc(s.reps)+' reps':''}${s.rpe?' · RPE '+esc(s.rpe):''}`).join(' / ')}`:'Your first log for this exercise. Set your baseline.'}</p>${a.logs[a.index].map((s,i)=>`<div class="set-grid"><span class="hint">${i+1}</span><label class="field">${e.kind==='strength'?'Weight (kg)':'Time (min)'}<input type="number" min="0" max="100000" step="any" inputmode="decimal" data-set="${i}" data-key="${e.kind==='strength'?'weight':'minutes'}" value="${esc(e.kind==='strength'?s.weight:s.minutes)}" placeholder="—"></label><label class="field">${e.kind==='strength'?'Reps':'Distance (km)'}<input type="number" min="0" max="100000" step="${e.kind==='strength'?'1':'any'}" inputmode="${e.kind==='strength'?'numeric':'decimal'}" data-set="${i}" data-key="${e.kind==='strength'?'reps':'distance'}" value="${esc(e.kind==='strength'?s.reps:s.distance)}" placeholder="${e.kind==='strength'?'—':'Optional'}"></label><button class="check ${s.done?'checked':''}" style="align-self:end" data-check="${i}" aria-label="Mark set or step ${i+1} ${s.done?'incomplete':'complete'}" aria-pressed="${s.done}">${s.done?'✓':'○'}</button></div>${extraFields(e,s,i)}`).join('')}<div class="actions"><button id="prev" ${a.index===0?'disabled':''}>← Previous</button><button class="primary" id="next" ${a.index===a.programme.exercises.length-1?'disabled':''}>Next exercise →</button></div><div class="row wrap" style="border-top:1px solid var(--line);margin-top:24px;padding-top:20px"><span class="hint">Rest timer <span id="timer" class="timer" style="display:block">${restText()}</span></span><div class="actions" style="margin:0"><button class="small" data-rest="60">60 sec</button><button class="small" data-rest="90">90 sec</button><button class="small" data-rest="0">Reset</button></div></div></section><section class="panel"><label class="field">Session notes<textarea id="notes" placeholder="How did it feel? Anything to remember for next time?">${esc(a.notes)}</textarea></label><div class="row wrap"><button class="primary" id="finish" ${done===0?'disabled':''}>Finish & save session</button><button class="small" id="discard">Discard session</button></div><p class="hint" style="margin:14px 0 0">Progress saves as you go. Finish whenever you’re ready; unfinished sets stay unmarked.</p></section>`;}
function finish(){const a=state.active;if(!a||!a.logs.flat().some(s=>s.done))return;state.history.push({...clone(a),finished:Date.now()});state.active=null;restUntil=0;const saved=save();view='history';render();toast(saved?'Session saved. Good work.':'Session recorded here — export a backup to keep it.');}
function historyView(){return intro('Every session counts','Your training history.')+`<div class="layout"><section class="panel"><div class="row wrap"><h2>${state.history.length} sessions recorded</h2><div class="row"><button class="small" id="export">Export backup</button><label class="button small" for="import">Restore backup</label><input type="file" id="import" accept="application/json,.json" hidden></div></div><p class="hint">Backups include sessions, history and any workout in progress. Keep a copy somewhere safe. Restore replaces the data in this browser.</p>${state.history.length?state.history.slice().reverse().map(h=>`<details class="history-item"><summary><strong>${esc(h.programme.name)}</strong><span class="hint" style="display:block">${date(h.finished)} · ${Math.round((h.finished-h.started)/60000)} min elapsed · ${h.logs.flat().filter(s=>s.done).length}/${h.logs.flat().length} sets / steps</span></summary><ul>${h.programme.exercises.map((e,i)=>`<li>${esc(e.name)} — ${h.logs[i].map(s=>s.done?(e.kind==='strength'?`${esc(s.weight||'—')} kg × ${esc(s.reps||'—')} reps${s.rpe?' · RPE '+esc(s.rpe):''}`:`${esc(s.minutes||'—')} min${s.distance?' · '+esc(s.distance)+' km':''}${s.weight!==''?' · '+esc(s.weight)+' kg':''}${s.reps!==''?' · '+esc(s.reps)+' reps':''}${s.rpe?' · RPE '+esc(s.rpe):''}`):'Not completed').join('; ')}</li>`).join('')}</ul>${h.notes?`<p>${esc(h.notes)}</p>`:''}</details>`).join(''):'<div class="empty"><div class="number">↗</div><h2 style="margin-top:20px">Your story starts with one session.</h2><p class="muted">Choose a session, log your work, and return here to see your progress.</p><button class="primary" onclick="switchView(\'train\')">Choose a session →</button></div>'}</section>${sidebar()}</div>`;}
function programmesView(){return intro('Built around you','Your session library.')+(editing?editorView():`<section class="panel"><div class="row wrap"><p class="muted">Start with a template, or create your own.</p><button class="primary" id="new-session">+ New session</button></div>${state.programmes.map(p=>`<div class="exercise"><div class="number">${p.type==='Strength'?'S':p.type==='Running'?'R':p.type==='HYROX'?'H':p.type==='Cycling'?'C':'M'}</div><div><h3>${esc(p.name)}</h3><span class="hint">${esc(p.type)} · ${p.minutes} min · ${p.exercises.length} exercises / steps</span></div><button class="small" data-edit="${esc(p.id)}">Edit</button></div>`).join('')}</section>`);}
function edit(id){editing=clone(state.programmes.find(p=>p.id===id)||make(crypto.randomUUID(),'My session','Strength',30,[['Exercise','3 × 10 reps',3]]));view='programmes';render();}
function editorView(){return `<form id="editor" class="panel"><h2>Edit your session</h2><div class="edit-grid" style="grid-template-columns:2fr 1fr 1fr"><label class="field">Session name<input id="edit-name" required maxlength="120" value="${esc(editing.name)}"></label><label class="field">Type<select id="edit-type">${['Strength','Running','HYROX','Cycling','Mobility','Circuit','Other'].map(t=>`<option ${t===editing.type?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Minutes<input id="edit-minutes" type="number" min="1" max="1440" required value="${editing.minutes}"></label></div><div id="edit-exercises">${editing.exercises.map((e,i)=>`<fieldset style="border:1px solid var(--line);border-radius:8px;margin:18px 0;padding:16px"><legend class="eyebrow">Exercise / step ${i+1}</legend><div class="edit-grid"><label class="field">Name<input data-edit-index="${i}" data-prop="name" required maxlength="120" value="${esc(e.name)}"></label><label class="field">Target / instructions<input data-edit-index="${i}" data-prop="target" maxlength="400" value="${esc(e.target)}"></label><button type="button" class="small" data-remove="${i}" aria-label="Remove exercise ${i+1}" ${editing.exercises.length===1?'disabled':''}>×</button></div><div class="row"><label class="field" style="flex:1">Log as<select data-edit-index="${i}" data-prop="kind"><option value="strength" ${e.kind==='strength'?'selected':''}>Weight & reps</option><option value="cardio" ${e.kind==='cardio'?'selected':''}>Time & distance</option><option value="timed" ${e.kind==='timed'?'selected':''}>Timed activity</option></select></label><label class="field" style="width:100px">Sets / steps<input data-edit-index="${i}" data-prop="sets" type="number" min="1" max="30" required value="${e.sets}"></label></div></fieldset>`).join('')}</div><button type="button" id="add-exercise">+ Add exercise / step</button><div class="actions"><button class="primary" type="submit">Save session</button><button type="button" onclick="editing=null;render()">Cancel</button></div><p class="hint">Changes apply to future workouts. Your existing history stays as recorded.</p></form>`;}
function restText(){let n=Math.max(0,Math.ceil((restUntil-Date.now())/1000));return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;}
function startRest(s){restUntil=s?Date.now()+s*1000:0;clearInterval(restTick);const update=()=>{if($('#timer'))$('#timer').textContent=restText();if(restUntil&&Date.now()>=restUntil){restUntil=0;clearInterval(restTick);toast('Rest complete. Ready for your next set.');}};update();if(s)restTick=setInterval(update,250);}
function download(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`form-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function bind(){if($('#session-select'))$('#session-select').onchange=e=>{selected=e.target.value;render();};if($('#start'))$('#start').onclick=()=>start(selected);if($('#edit-selected'))$('#edit-selected').onclick=()=>edit(selected);document.querySelectorAll('[data-set]').forEach(el=>el.oninput=()=>{if(!el.validity.valid)return;state.active.logs[state.active.index][Number(el.dataset.set)][el.dataset.key]=el.value;save();});document.querySelectorAll('[data-check]').forEach(el=>el.onclick=()=>{if([...document.querySelectorAll('[data-set]')].some(x=>!x.reportValidity()))return;const s=state.active.logs[state.active.index][Number(el.dataset.check)];s.done=!s.done;save();render();});if($('#notes'))$('#notes').oninput=e=>{state.active.notes=e.target.value;save();};if($('#next'))$('#next').onclick=()=>{state.active.index++;save();render();};if($('#prev'))$('#prev').onclick=()=>{state.active.index--;save();render();};if($('#finish'))$('#finish').onclick=()=>{const a=state.active,missing=a.logs.flat().filter(s=>!s.done).length;if(missing)ask('Finish this session?',`${missing} sets or steps are still unmarked. Save the work you have logged?`,finish);else finish();};if($('#discard'))$('#discard').onclick=()=>ask('Discard this session?','This removes your current workout and its logged sets. Saved history stays available.',()=>{state.active=null;save();startRest(0);render();});document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startRest(Number(b.dataset.rest)));if($('#export'))$('#export').onclick=download;if($('#import'))$('#import').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>10000000){toast('Backup is too large (maximum 10 MB).');return;}try{const d=JSON.parse(await f.text());if(!validData(d))throw Error();ask('Restore this backup?',`Replace this browser’s data with ${d.history.length} saved sessions and ${d.programmes.length} session templates? Export your current backup first if you need it.`,()=>{state=clone(d);mergeSessionLibrary();storageBlocked=false;$('#storage-warning').hidden=true;const saved=save();startRest(0);render();toast(saved?'Backup restored.':'Restored here, but browser storage is unavailable.');});}catch{toast('That file is not a valid FORM backup. Nothing has changed.');}};if($('#new-session'))$('#new-session').onclick=()=>edit(null);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));if($('#editor')){const sync=()=>{editing.name=$('#edit-name').value;editing.type=$('#edit-type').value;editing.minutes=Number($('#edit-minutes').value);document.querySelectorAll('[data-edit-index]').forEach(el=>{editing.exercises[Number(el.dataset.editIndex)][el.dataset.prop]=el.dataset.prop==='sets'?Number(el.value):el.value;});};$('#add-exercise').onclick=()=>{sync();if(editing.exercises.length>=100)return;editing.exercises.push({name:'',target:'',sets:1,kind:'strength'});render();};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{sync();editing.exercises.splice(Number(b.dataset.remove),1);render();});$('#editor').onsubmit=e=>{e.preventDefault();sync();editing.name=editing.name.trim();editing.exercises.forEach(e=>e.name=e.name.trim());if(!validProgramme(editing)){toast('Add a session name and a name for each exercise.');return;}const i=state.programmes.findIndex(p=>p.id===editing.id);if(i<0)state.programmes.push(clone(editing));else state.programmes[i]=clone(editing);const saved=save();editing=null;render();toast(saved?'Session saved.':'Session updated here — export a backup to keep it.');};}}
mergeSessionLibrary();save();render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_training_log',description:'Read session templates, saved history and the active workout in this browser.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>clone(state)})).catch(()=>{});}catch{}}
</script></body></html>
